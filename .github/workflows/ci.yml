name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the safety scan sees every past version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Public-safety scan (whole history)
        run: node scripts/public-safety.mjs --history
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Download Electron binary
        run: node node_modules/electron/install.js
      - name: End-to-end (Electron)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: test-results/
          retention-days: 7
